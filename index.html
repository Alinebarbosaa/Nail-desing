<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Aberta - Nail Designer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1 class="titulo-logo">Emille - Nail-Desing</h1>
    <p>Transforme suas unhas com estilo e elegância</p>
    <h3 class="agenda">Agende seu horário</h3>
  </header>

  <main>
    <section class="servicos">
      <h2>Escolha seu serviço</h2>
      <div class="opcoes">
        <label><input type="checkbox"> Alongamento em Fibra</label>
        <label><input type="checkbox"> Banho de Gel</label>
        <label><input type="checkbox"> Esmaltação em Gel</label>
        <label><input type="checkbox"> Blindagem</label>
        <label><input type="checkbox"> Cuticulagem</label>
      </div>
      <button id="agendarBtn">💅 Agende por aqui!</button>
      <a class="btn-agendar"></a>
      
    </section>

    <section class="galeria">
      <h2>Inspirações</h2>
      <div class="imagens">
        
        <img src="./img/01.jpg" alt="Unhas decoradas 3">
        <img src="./img/02.jpg" alt="Unhas decoradas 3">
        <img src="./img/03.jpg" alt="Unhas decoradas 3">
        <img src="./img/04.jpg" alt="Unhas decoradas 3">
        <img src="./img/05.jpg" alt="Unhas decoradas 3">
        <img src="./img/06.jpg" alt="Unhas decoradas 3">
        <img src="./img/07.jpg" alt="Unhas decoradas 3">
        <img src="./img/08.jpg" alt="Unhas decoradas 3">
        <img src="./img/09.jpg" alt="Unhas decoradas 3">




        
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 por Aline Nail Designer 💖 | Siga no Instagram @seuperfil</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
